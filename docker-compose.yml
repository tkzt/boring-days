services:
  app:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NUXT_DATABASE_URL: postgresql://calendar:calendar@db:5432/boring_days
      NUXT_AUTH_SECRET: ${NUXT_AUTH_SECRET:?Set NUXT_AUTH_SECRET to a long random value before starting Docker Compose}
      NUXT_USER_PASSWORD: ${NUXT_USER_PASSWORD:?Set NUXT_USER_PASSWORD to the admin password before starting Docker Compose}
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: boring_days
      POSTGRES_USER: calendar
      POSTGRES_PASSWORD: calendar
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calendar -d boring_days"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: