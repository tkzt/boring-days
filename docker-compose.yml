services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      NUXT_DATABASE_URL: postgresql://calendar:calendar@db:5432/boring_days
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: boring_days
      POSTGRES_USER: calendar
      POSTGRES_PASSWORD: calendar
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calendar -d boring_days"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: